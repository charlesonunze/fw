syntax = "proto3";

package inventory.v1;

option go_package = "github.com/charlesonunze/fw/examples/ecomm/internal/modules/inventory/pb;inventorypb";

// InventoryService manages item stock.
service InventoryService {
  // Reserve attempts to lock stock for an order.
  // Returns error if insufficient quantity available.
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
}

message ReserveRequest {
  repeated ReserveItem items = 1;
}

message ReserveItem {
  string item_id = 1;
  int32 quantity = 2;
}

message ReserveResponse {
  string reservation_id = 1;
}

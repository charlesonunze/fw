name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'adapters/chi/v*.*.*'
      - 'adapters/gin/v*.*.*'

permissions:
  contents: write

jobs:
  configure:
    name: Configure Release
    runs-on: ubuntu-latest
    outputs:
      directory: ${{ steps.release.outputs.directory }}
      make_latest: ${{ steps.release.outputs.make_latest }}
      release_name: ${{ steps.release.outputs.release_name }}
    steps:
      - name: Resolve module from tag
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "directory=." >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "release_name=fw $TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^adapters/chi/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "directory=adapters/chi" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "release_name=Chi router adapter ${TAG##*/}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^adapters/gin/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "directory=adapters/gin" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "release_name=Gin router adapter ${TAG##*/}" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported release tag: $TAG" >&2
            exit 1
          fi

  test:
    name: Test Release
    runs-on: ubuntu-latest
    needs: configure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ needs.configure.outputs.directory }}/go.mod
          cache: true
          cache-dependency-path: ${{ needs.configure.outputs.directory }}/go.sum

      - name: Vet, build, and test
        env:
          MODULE_DIRECTORY: ${{ needs.configure.outputs.directory }}
        run: |
          if [[ "$MODULE_DIRECTORY" == "." ]]; then
            cd "$MODULE_DIRECTORY"
          else
            release_directory=$(mktemp -d)
            cp -R "$MODULE_DIRECTORY/." "$release_directory"
            cd "$release_directory"
            go mod edit -dropreplace=github.com/charlesonunze/fw
            go mod download github.com/charlesonunze/fw
          fi

          go mod download
          go vet ./...
          go build ./...
          go test -race -count=1 ./...

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [configure, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.configure.outputs.release_name }}
          generate_release_notes: true
          make_latest: ${{ needs.configure.outputs.make_latest }}

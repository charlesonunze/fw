name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  modules:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Framework
            directory: .
          - name: Chi Adapter
            directory: adapters/chi
          - name: Gin Adapter
            directory: adapters/gin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.directory }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.directory }}/go.sum

      - name: Vet
        working-directory: ${{ matrix.directory }}
        run: go vet ./...

      - name: Build
        working-directory: ${{ matrix.directory }}
        run: go build ./...

      - name: Test
        working-directory: ${{ matrix.directory }}
        run: go test -race -count=1 ./...

      - name: Vulnerability scan
        working-directory: ${{ matrix.directory }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
